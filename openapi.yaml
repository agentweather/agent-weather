openapi: 3.1.0
info:
  title: Agent Weather API
  version: 1.2.0
  summary: Forecasts for the agent economy. Pay-per-call conditions reports on the AI-agent ecosystem, paid via x402 on the XRP Ledger.
  description: |
    Agent Weather sells a JSON "conditions report" on the AI-agent ecosystem per request, paid with
    [x402](https://x402.org) v2 (scheme `exact`) on XRPL mainnet (`xrpl:0`). No API key or account.

    **Payment flow**
    1. Call the paid endpoint without payment and receive **402** with a `PAYMENT-REQUIRED` header
       (base64 of the same JSON as the body). Each 402 mints a fresh single-use `extra.invoiceId`.
    2. Choose one entry from `accepts[]` (XRP or RLUSD), sign an XRPL `Payment` bound to that invoice,
       and retry with the base64 x402 `PaymentPayload` in `PAYMENT-SIGNATURE`.
    3. The server verifies and settles through the facilitator and re-checks the transaction on-ledger.
       It then returns **200** with the report and a `PAYMENT-RESPONSE` header.

    Settlement uses the T54 XRPL mainnet facilitator (`https://xrpl-facilitator-mainnet.t54.ai`).
    Use the `x402-xrpl` client (npm/PyPI). The reference `@x402/xrpl` client currently can't pay through
    T54 (https://github.com/x402-foundation/x402/issues/3527).

    The live `/.well-known/x402` catalog is the source of truth for prices.

    To see the format before paying, `GET /v1/sample/yesterday` (free, no payment) returns the stored
    conditions report from about 24 hours ago with a `sample` block marking it as free and not live.
  contact: { name: Agent Weather, url: 'https://github.com/agentweather/agent-weather' }
  license: { name: CC-BY-4.0, url: 'https://creativecommons.org/licenses/by/4.0/' }
  x-logo: { url: 'https://raw.githubusercontent.com/agentweather/agent-weather/main/assets/logo.png' }
  x-guidance: |
    Agent Weather sells one JSON report per x402 payment. To buy: GET
    https://api.agentweather.io/v1/agent-weather/current with no payment header; you receive HTTP 402 with a
    PAYMENT-REQUIRED header (base64 JSON, same as the body). Pick one accepts[] entry (network xrpl:0; 6700 drops
    XRP or 0.01 RLUSD), sign an XRPL Payment bound to extra.invoiceId, and retry the same request with the base64
    PaymentPayload in PAYMENT-SIGNATURE. Every 402 mints a fresh single-use invoice, so always pay the most recent
    one. Use the x402-xrpl client (npm/PyPI); the reference @x402/xrpl client cannot pay through the T54
    facilitator yet (x402 issue #3527). The 200 body is the report plus a payment receipt; the PAYMENT-RESPONSE
    header carries the XRPL transaction hash. POST behaves like GET (body ignored). Free: /v1/sample/yesterday
    (yesterday's stored report, same JSON format, not live), /healthz, /.well-known/x402, /openapi.json,
    /llms.txt, /v1/methodology. Other paid resources, same flow and headers: /v1/agent-weather/x402-activity,
    /v1/pulse/storm, /v1/pulse/facilitator, /v1/pulse/providers, /v1/merchant/{address}, /v1/health/report,
    /v1/price-index (prices in /.well-known/x402).
externalDocs: { description: Repository and docs, url: 'https://github.com/agentweather/agent-weather' }
# No API keys or auth: access is granted per request by an x402 payment (PAYMENT-SIGNATURE header).
security: []
servers: [{ url: 'https://api.agentweather.io', description: 'Production (XRPL mainnet, xrpl:0)' }]
tags:
  - { name: paid, description: Resources that require an x402 payment }
  - { name: discovery, description: Free discovery and health endpoints }
paths:
  /v1/agent-weather/current:
    get:
      tags: [paid]
      operationId: getCurrentConditions
      summary: Current agent-ecosystem conditions (paid, 0.0067 XRP or 0.01 RLUSD)
      description: |
        Current conditions snapshot: GitHub stats for 6 agent frameworks (LangChain, LangGraph, AutoGen, CrewAI,
        OpenAI Agents SDK, MCP servers), OpenAI/Anthropic/GitHub/Cursor status and incidents, MCP Registry entries
        updated in the last hour, npm weekly downloads (@modelcontextprotocol/sdk, @x402/core, @x402/xrpl) and XRPL
        mainnet server_info. Weather-style indices (visibility, pressure), per-source timestamps, data gaps and
        modeled confidence. Also: x402 payment activity on XRPL mainnet from our own ledger scan (t54-tagged payments,
        volume per asset, unique payers/merchants, heuristic real-vs-automated split with per-merchant concentration),
        plus 24h/7d baselines, baseline-relative temperature/pressure and fronts. JSON, cached up to 5 minutes.
      parameters: [{ $ref: '#/components/parameters/PaymentSignature' }, { $ref: '#/components/parameters/XPayment' }]
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Busy' }
      x-payment-info:
        price: { mode: fixed, currency: USD, amount: '0.01' }
        protocols: [{ x402: {} }]
      x-x402: { $ref: '#/components/x-x402-pricing' }
    post:
      tags: [paid]
      operationId: postCurrentConditions
      summary: Same as GET (request body is ignored)
      description: POST behaves exactly like GET, with the same invoice/verify/settle flow. The request body is ignored.
      parameters: [{ $ref: '#/components/parameters/PaymentSignature' }, { $ref: '#/components/parameters/XPayment' }]
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Busy' }
      x-payment-info:
        price: { mode: fixed, currency: USD, amount: '0.01' }
        protocols: [{ x402: {} }]
      requestBody:
        required: false
        description: 'Ignored. Send no body or {}.'
        content: { application/json: { schema: { type: object, additionalProperties: true, maxProperties: 0 } } }
  /v1/sample/yesterday:
    get:
      tags: [discovery]
      operationId: getSampleYesterday
      summary: 'Free sample: yesterday''s conditions report (free, no payment)'
      description: |
        Free sample of the paid `/v1/agent-weather/current` report: the stored conditions report from about 24 hours
        ago (the latest scheduled snapshot that is at least 24h old), in the same JSON format as the paid route, with
        a `sample` block added that marks it as free and not live. No payment and no 402. Use it to try the format
        before buying; for current conditions, buy `/v1/agent-weather/current` via x402. The response has no `payment`
        receipt. Snapshots stored before 2026-10-03 used older confidence formulas and may mislabel GitHub sources
        (see `/v1/methodology`).
      security: []
      responses:
        '200':
          description: |
            Yesterday's stored report plus a `sample` block (the example is abridged). If no snapshot that old exists yet,
            the body is `{sample, error: no_snapshot_for_prior_day}` instead.
          headers:
            Cache-Control: { description: '`public, max-age=3600`', schema: { type: string } }
            X-AgentWeather-Sample: { description: 'Always `free` on this route.', schema: { type: string, const: free } }
            RateLimit: { $ref: '#/components/headers/RateLimit' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - { $ref: ./schemas/report.schema.json }
                      - { type: object, required: [sample], properties: { sample: { $ref: '#/components/schemas/SampleLabel' } } }
                  - type: object
                    required: [sample, error]
                    properties:
                      sample: { $ref: '#/components/schemas/SampleLabel' }
                      error: { type: string, const: no_snapshot_for_prior_day }
              example:
                sample:
                  free_sample: true
                  paid_product: false
                  sample_of: /v1/agent-weather/current
                  age: at least 24 hours old
                  note: 'FREE SAMPLE: the stored conditions report from about 24 hours ago, same JSON format as the paid route. Not live data and not a paid product. For current conditions, buy /v1/agent-weather/current via x402.'
                  buy: https://api.agentweather.io/v1/agent-weather/current
                  discovery: https://api.agentweather.io/.well-known/x402
                  snapshot_taken_at: '2026-10-03T01:15:02.000Z'
                example_data: false
                schema_version: 0.2.0-draft
                report_id: awr-2026-10-03T0115Z-all
                issued_at: '2026-10-03T01:15:02.000Z'
                valid_from: '2026-10-03T01:15:02.000Z'
                valid_to: '2026-10-03T01:30:02.000Z'
                scope: { ecosystem: all, region: global }
                conditions:
                  visibility: { name: data coverage, value: 1, unit: fraction of expected sources reporting, observed: true }
                alerts: []
                forecast: []
                sources: []
                data_gaps: []
                confidence: { overall: 0.5, scale: '0-1', modeled: true }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Snapshot history unavailable.
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, const: sample_unavailable } } }
  /.well-known/x402:
    get:
      tags: [discovery]
      operationId: getX402Catalog
      summary: x402 discovery catalog (free)
      description: Lists paid resources, prices, payTo, and facilitators. Crawled hourly by the XRPL AI Hub (xrpl-ai.org).
      responses:
        '200':
          description: Catalog
          content: { application/json: { schema: { $ref: '#/components/schemas/X402Catalog' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
      security: []
  /healthz:
    get:
      tags: [discovery]
      operationId: getHealth
      summary: Liveness and dependency health (free, not rate limited)
      responses:
        '200':
          description: Healthy
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
        '503':
          description: Invoice database unavailable (same body shape, ok=false)
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
      security: []
  /:
    get:
      tags: [discovery]
      operationId: getServiceIndex
      summary: Service index (free)
      responses:
        '200':
          description: Service index
          content:
            application/json:
              schema:
                type: object
                required: [service, version, network, paid, discovery, health]
                properties:
                  service: { type: string, const: agent-weather }
                  version: { type: string, examples: ['1.2.0'] }
                  network: { type: string, examples: ['xrpl:0'] }
                  paid: { type: string, format: uri }
                  discovery: { type: string, format: uri }
                  health: { type: string, examples: [/healthz] }
                  openapi: { type: string, format: uri }
                  free_sample: { type: string, format: uri, description: Free sample route (/v1/sample/yesterday) }
        '429': { $ref: '#/components/responses/RateLimited' }
      security: []
  /openapi.json:
    get:
      tags: [discovery]
      operationId: getOpenApi
      summary: This OpenAPI document (free)
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document
          content: { application/json: { schema: { type: object } } }
  /llms.txt:
    get:
      tags: [discovery]
      operationId: getLlmsTxt
      summary: Agent-readable overview (free)
      security: []
      responses:
        '200':
          description: Markdown (llmstxt.org)
          content: { text/plain: { schema: { type: string } } }
  /v1/agent-weather/x402-activity:
    get:
      tags: [paid]
      operationId: getAgentWeatherX402Activity
      summary: 'Agent Weather: x402 activity on XRPL (paid, 0.0067 XRP or 0.01 RLUSD)'
      description: |
        x402 payment activity on XRPL mainnet from our own validated-ledger scan (Payments tagged with the t54
        facilitator SourceTag 804681468): payments and delivered volume per asset (XRP, RLUSD, other tokens) for the
        last 1h / 24h / 7d, hourly and daily series, unique payers and merchants, top and new merchants, coverage
        window, sample transactions with explorer links, a heuristic real-vs-automated split (all / automated_cluster
        / organic_candidate from a payer-cluster classifier: creation batches, funding lineage, timing regularity,
        uniform-random amounts) with per-payee concentration (HHI, top-payer share), and explicit caveats. JSON,
        cached up to 60 seconds.
      parameters: [{ $ref: '#/components/parameters/PaymentSignature' }, { $ref: '#/components/parameters/XPayment' }]
      responses:
        '200':
          description: 'Payment settled and verified on-ledger. Returns the resource body with a `payment` receipt appended.'
          headers:
            PAYMENT-RESPONSE:
              description: |
                Base64 JSON `{success, transaction, network, payer}`. `transaction` is the XRPL tx hash (your receipt).
              schema: { type: string }
            X-Facilitator: { description: 'Which facilitator settled (`t54`). Debug aid.', schema: { type: string } }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/X402ActivityBody' }
                  - { type: object, properties: { payment: { $ref: '#/components/schemas/PaymentReceipt' } } }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Busy' }
      x-payment-info:
        price: { mode: fixed, currency: USD, amount: '0.01' }
        protocols: [{ x402: {} }]
      x-x402:
        network: xrpl:0
        scheme: exact
        payTo: rnFHPGmgTLSg7hjzfr8wiHaTdTh3PijrZZ
        facilitator: https://xrpl-facilitator-mainnet.t54.ai
        options:
          - { asset: XRP, amount: '6700', unit: drops, display: '0.0067 XRP' }
          - asset: 524C555344000000000000000000000000000000
            symbol: RLUSD
            issuer: rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De
            amount: '0.01'
            unit: value
            display: 0.01 RLUSD
    post:
      tags: [paid]
      operationId: postAgentWeatherX402Activity
