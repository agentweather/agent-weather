components:
  x-x402-pricing:
    network: xrpl:0
    scheme: exact
    payTo: rnFHPGmgTLSg7hjzfr8wiHaTdTh3PijrZZ
    facilitator: https://xrpl-facilitator-mainnet.t54.ai
    options:
      - { asset: XRP, amount: '6700', unit: drops, display: '0.0067 XRP' }
      - asset: 524C555344000000000000000000000000000000
        symbol: RLUSD
        issuer: rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De
        amount: '0.01'
        unit: value
        display: 0.01 RLUSD
  parameters:
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      required: false
      description: |
        Base64-encoded x402 v2 PaymentPayload (`{x402Version, accepted, payload:{signedTxBlob, invoiceId?}}`). Omit it
        to receive a 402. Max 16384 characters.
      schema: { type: string, maxLength: 16384 }
    XPayment:
      name: X-PAYMENT
      in: header
      required: false
      deprecated: true
      description: Legacy (x402 v1-style) header name, accepted as a fallback when PAYMENT-SIGNATURE is absent.
      schema: { type: string, maxLength: 16384 }
  headers:
    RateLimit:
      description: |
        IETF draft-7 rate limit header, e.g. `limit=30, remaining=29, reset=60` (paid route: 30/min per IP; other
        routes: 120/min).
      schema: { type: string }
    RateLimitPolicy: { description: 'e.g. `30;w=60`', schema: { type: string } }
    XRequestId: { description: 'Request id (echoes an incoming X-Request-Id, else a UUID).', schema: { type: string } }
  responses:
    Report:
      description: 'Payment settled and verified on-ledger. Returns the report, with a `payment` object appended.'
      headers:
        PAYMENT-RESPONSE:
          description: 'Base64 JSON `{success, transaction, network, payer}`. `transaction` is the XRPL tx hash (your receipt).'
          schema: { type: string }
        X-Facilitator: { description: 'Which facilitator settled (`t54`). Debug aid.', schema: { type: string } }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: ./schemas/report.schema.json }
              - { type: object, properties: { payment: { $ref: '#/components/schemas/PaymentReceipt' } } }
    PaymentRequired:
      description: |
        Payment required, or the payment attempt was rejected. Every 402 carries a **fresh** invoice.
        `error` is `payment_required` on a first call; other values explain a rejected attempt.
      headers:
        PAYMENT-REQUIRED: { description: Base64 of the same JSON as the response body., schema: { type: string } }
        RateLimit: { $ref: '#/components/headers/RateLimit' }
        RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/PaymentRequired' } } }
    RateLimited:
      description: Too many requests from this IP.
      headers:
        RateLimit: { $ref: '#/components/headers/RateLimit' }
        RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string, const: rate_limited } } }
    Busy:
      description: Too many open invoices server-wide. Retry after the indicated delay.
      headers:
        Retry-After: { schema: { type: integer, examples: [30] } }
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string, const: busy_try_later } } }
  # The report body schema (and its $defs) lives in ./schemas/report.schema.json.
  schemas:
    PaymentRequirement:
      type: object
      required: [scheme, network, payTo, maxTimeoutSeconds, asset, amount, extra]
      properties:
        scheme: { type: string, const: exact }
        network: { type: string, examples: ['xrpl:0'] }
        payTo: { type: string, examples: [rnFHPGmgTLSg7hjzfr8wiHaTdTh3PijrZZ] }
        maxTimeoutSeconds: { type: integer, examples: [120] }
        asset:
          type: string
          description: |
            `XRP`, or the 40-hex currency code for an issued token (RLUSD = 524C555344000000000000000000000000000000).
        amount: { type: string, description: 'Integer drops for XRP (10000 = 0.01 XRP), decimal value string for issued tokens.' }
        extra:
          type: object
          required: [invoiceId, sourceTag, areFeesSponsored]
          properties:
            invoiceId:
              type: string
              pattern: '^aw-'
              description: Single-use invoice. Bind the payment to it (InvoiceID = SHA-256(invoiceId)).
            sourceTag: { type: integer, const: 804681468, description: T54 facilitator SourceTag }
            areFeesSponsored: { type: boolean, const: false, description: The payer pays the XRPL network fee. }
            issuer:
              type: string
              description: Present for issued tokens (RLUSD mainnet issuer rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De).
    PaymentRequired:
      type: object
      required: [x402Version, error, resource, accepts]
      properties:
        x402Version: { type: integer, const: 2 }
        error:
          type: string
          enum:
            - payment_required
            - invalid_payment_header
            - missing_invoice_id
            - invoice_id_mismatch
            - accepted_requirement_not_offered
            - unknown_invoice
            - no_facilitator_for_network
            - invoice_resource_mismatch
            - invoice_already_used
            - invoice_in_flight
            - invoice_locked_settle_failed
            - invoice_expired
            - verify_failed
            - settle_failed
            - ledger_verification_failed
            - duplicate_transaction
            - internal_error
        resource:
          type: object
          required: [url, description, mimeType]
          properties:
            url: { type: string, format: uri }
            description: { type: string }
            mimeType: { type: string, const: application/json }
            serviceName: { type: string, maxLength: 32, description: Bazaar service metadata (printable ASCII) }
            tags: { type: array, maxItems: 5, items: { type: string, maxLength: 32 } }
            iconUrl: { type: string, format: uri, maxLength: 2048 }
        accepts: { type: array, items: { $ref: '#/components/schemas/PaymentRequirement' } }
        facilitator: { type: string, description: Present on verify_failed / settle_failed. }
        facilitatorResponse: { type: object, description: Raw facilitator reply (verify_failed / settle_failed). }
        reason: { type: string, description: Present on ledger_verification_failed. }
        transaction: { type: string, description: Present on ledger_verification_failed. }
        extensions:
          type: object
          description: |
            x402 v2 extensions. `bazaar` carries the discovery declaration (info + JSON Schema) used by CDP Bazaar and
            x402scan.
          properties:
            bazaar: { type: object, required: [info, schema], properties: { info: { type: object }, schema: { type: object } } }
    PaymentReceipt:
      type: object
      required: [protocol, scheme, network, asset, amount, transaction, explorer, invoiceId, facilitator]
      properties:
        protocol: { type: string, const: x402 }
        scheme: { type: string, const: exact }
        network: { type: string, examples: ['xrpl:0'] }
        asset: { type: string, enum: [XRP, RLUSD] }
        amount: { type: string, examples: ['10000'] }
        transaction: { type: string, description: XRPL transaction hash }
        explorer: { type: string, format: uri }
        invoiceId: { type: string }
        facilitator: { type: string, examples: [t54] }
    CatalogPrice:
      type: object
      required: [scheme, network, payTo, asset, amount, unit]
      properties:
        scheme: { type: string }
        network: { type: string }
        payTo: { type: string }
        asset: { type: string }
        symbol: { type: string }
        issuer: { type: string }
        amount: { type: string }
        unit: { type: string, enum: [drops, value] }
    X402Catalog:
      type: object
      required: [x402Version, name, description, resources, facilitators, updatedAt]
      properties:
        x402Version: { type: integer, const: 2 }
        name: { type: string }
        description: { type: string }
        website: { type: string, format: uri }
        resources:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              resource: { type: string, format: uri }
              method: { type: string }
              methods: { type: array, items: { type: string } }
              type: { type: string, const: http }
              name: { type: string }
              description: { type: string }
              mimeType: { type: string }
              network: { type: string }
              scheme: { type: string }
              payTo: { type: string }
              asset: { type: string }
              amount: { type: string }
              unit: { type: string }
              accepts: { type: array, items: { $ref: '#/components/schemas/CatalogPrice' } }
              extra: { type: object }
        items: { type: array, description: Legacy shape kept for older clients., items: { type: object } }
        facilitators: { type: array, items: { type: string, format: uri } }
        updatedAt: { type: string, format: date-time }
    Health:
      type: object
      required: [ok, version, network, payTo, uptimeSec, db, openInvoices, facilitator]
      properties:
        ok: { type: boolean }
        version: { type: string }
        network: { type: string }
        payTo: { type: string }
        uptimeSec: { type: integer }
        db: { type: boolean }
        openInvoices: { type: [integer, 'null'] }
        facilitator:
          type: object
          properties:
            url: { type: string, format: uri }
            reachable: { type: boolean }
            checkedAt: { type: [string, 'null'], format: date-time }
            detail: { type: string }
    X402ActivityBody:
      title: 'Agent Weather x402 activity on XRPL (draft 0.2: adds activity.real_vs_automated)'
      type: object
      required: [example_data, schema_version, report_id, issued_at, scope, activity, sources, data_gaps, methodology]
      properties:
        example_data: { const: false }
        schema_version: { type: string }
        report_id: { type: string }
        issued_at: { type: string, format: date-time }
        scope:
          type: object
          required: [ecosystem, network]
          properties: { ecosystem: { const: x402 }, network: { const: 'xrpl:0' } }
        activity: { $ref: './schemas/report.schema.json#/$defs/x402Activity' }
        sources:
          type: array
          items:
            type: object
            required: [name, url, observed_at]
            properties: { url: { type: string, format: uri }, observed_at: { type: string, format: date-time } }
        data_gaps: { type: array, items: { type: object, required: [gap, reason] } }
        methodology: { type: object, required: [definitions] }
        payment: { type: object }
    Pulse:
      type: object
      required: [schema_version, signal, level, reason, asOf, sources]
      properties:
        signal: { enum: [storm, facilitator, providers] }
        level: { type: string }
        reason: { type: string, minLength: 3 }
        asOf: { type: [string, 'null'], format: date-time }
        storm: { type: boolean }
        ok: { type: [boolean, 'null'] }
        degraded: { type: boolean }
        sources: { type: array }
      allOf:
        - if: { properties: { signal: { const: storm } } }
          then:
            required: [storm]
            properties: { level: { enum: [calm, breezy, unsettled, storm, unknown] } }
        - if: { properties: { signal: { const: facilitator } } }
          then:
            required: [ok]
            properties: { level: { enum: [ok, degraded, down, unknown] } }
        - if: { properties: { signal: { const: providers } } }
          then:
            required: [degraded, providers]
            properties: { level: { enum: [operational, minor, major, critical, unknown] } }
    Merchant:
      type: object
      required: [example_data, schema_version, report_id, issued_at, merchant, sources, data_gaps, methodology]
      properties:
        example_data: { const: false }
        sources:
          type: array
          items:
            type: object
            required: [name, url, observed_at]
            properties: { observed_at: { type: [string], format: date-time }, url: { type: string } }
        data_gaps: { type: array, items: { type: object, required: [gap, reason] } }
        merchant:
          type: object
          required: [address]
          properties:
            address: { type: string, pattern: '^r[1-9A-HJ-NP-Za-km-z]{24,34}$' }
            directory_listing: { type: object, required: [status, reason] }
            score:
              type: object
              required: [value, band, score_coverage, components, method]
              properties:
                value: { type: [integer, 'null'], minimum: 0, maximum: 100 }
                band: { enum: [no_concentration_flags, mixed_signals, concentrated_or_automated_traffic, insufficient_data] }
                components:
                  type: object
                  additionalProperties:
                    type: object
                    required: [weight, value, basis]
                    properties:
                      weight: { type: number }
                      value: { type: [number, 'null'], minimum: 0, maximum: 1 }
                      basis: { type: string }
            concentration: { type: object, required: [payer_hhi, top_payer_share] }
            account: { type: object, required: [created_at, domain_field, source] }
    HealthReport:
      type: object
      required: [example_data, schema_version, issued_at, endpoints, drift, facilitator, sources, data_gaps, methodology]
      properties:
        sources:
          type: array
          items:
            type: object
            required: [name, url, observed_at]
            properties: { observed_at: { type: [string], format: date-time }, url: { type: string } }
        data_gaps: { type: array, items: { type: object, required: [gap, reason] } }
        endpoints:
          type: [object, 'null']
          required: [cycle, checked_to, probed, status_counts, results]
          properties:
            results:
              type: array
              items:
                type: object
                required: [url, status, valid_402]
                properties:
                  status:
                    enum:
                      - live_402
                      - live_402_testnet_only
                      - invalid_402
                      - live_405_get_not_allowed
                      - live_200_no_payment
                      - not_found
                      - server_error
                      - client_error
                      - unreachable
        facilitator:
          type: [object, 'null']
          required: [level, ok, reasons, checked_at, reachability, method]
          properties: { level: { enum: [ok, degraded, down, unknown] } }
    PriceIndex:
      type: object
      required: [example_data, schema_version, issued_at, index, sources, data_gaps, methodology]
      properties:
        sources:
          type: array
          items:
            type: object
            required: [name, url, observed_at]
            properties: { observed_at: { type: [string], format: date-time }, url: { type: string } }
        data_gaps: { type: array, items: { type: object, required: [gap, reason] } }
        index:
          type: [object, 'null']
          required:
            - cycle
            - as_of
            - scope
            - live_endpoints
            - categories
            - distribution_usd
            - changes_since_previous_cycle
            - endpoints
            - method
          properties:
            categories: { type: array, items: { type: object, required: [category, live_endpoints, cheapest] } }
            distribution_usd: { type: object, required: [n, median, bands] }
    SampleLabel:
      type: object
      description: Added by /v1/sample/yesterday only. Marks the body as a free, non-live sample.
      required: [free_sample, paid_product, sample_of, age, note, buy, discovery]
      properties:
        free_sample: { type: boolean, const: true }
        paid_product: { type: boolean, const: false }
        sample_of: { type: string, examples: [/v1/agent-weather/current] }
        age: { type: string, examples: [at least 24 hours old] }
        note: { type: string }
        buy: { type: string, format: uri }
        discovery: { type: string, format: uri }
        snapshot_taken_at:
          type: string
          format: date-time
          description: When the stored snapshot was taken (absent on the no_snapshot_for_prior_day body).
